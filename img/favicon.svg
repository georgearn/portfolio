<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1e2d"/>
      <stop offset="1" stop-color="#12131e"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3baf7"/>
      <stop offset="1" stop-color="#8074cf"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- hex core -->
  <g filter="url(#glow)">
    <polygon points="32,12 46,20 46,36 32,44 18,36 18,20" fill="none" stroke="url(#acc)" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="32,20 39,24 39,32 32,36 25,32 25,24" fill="url(#acc)" opacity="0.85"/>
  </g>

  <!-- circuit traces -->
  <g stroke="url(#acc)" stroke-width="1.4" stroke-linecap="round" filter="url(#glow)" fill="none">
    <path d="M32 12 L32 5"/>
    <path d="M46 20 L54 20"/>
    <path d="M46 36 L54 36 L54 42"/>
    <path d="M18 36 L10 36 L10 30"/>
    <path d="M18 20 L10 20"/>
    <path d="M32 44 L32 52 L38 52"/>
  </g>

  <!-- circuit nodes -->
  <g fill="#c9c1f7" filter="url(#glow)">
    <circle cx="32" cy="5" r="1.3"/>
    <circle cx="54" cy="20" r="1.3"/>
    <circle cx="54" cy="42" r="1.3"/>
    <circle cx="10" cy="30" r="1.3"/>
    <circle cx="10" cy="20" r="1.3"/>
    <circle cx="38" cy="52" r="1.3"/>
  </g>
</svg>
